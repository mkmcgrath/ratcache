[project]
name = "ratcache"
version = "0.1.0"
description = "Command-line client for RatCache"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
ratcache = "ratcache.main:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ratcache"]
